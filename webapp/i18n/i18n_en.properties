howToPlay.hint3=3rd Clue
howToPlay.hint3Pts=8 pts

howToPlay.rulesTitle=📜 ROUND RULES
howToPlay.rule1=The wheel spins to pick an envelope with the secret word.
howToPlay.rule2=The current player receives the clue and has a time limit to answer.
howToPlay.rule3=If they guess wrong or time runs out, the turn passes to the rival with the next clue.

howToPlay.audienceTitle=👥 THE AUDIENCE
howToPlay.audienceRule1=If both players fail or time runs out after 3 clues, it goes to the Audience!
howToPlay.audienceRule2=The Audience can try as many answers as they want or skip the turn.
howToPlay.audienceRule3=When it reaches the Audience, a correct answer is ALWAYS worth 10 POINTS (even after skipping or wrong attempts)!

howToPlay.tipText=You can upload your own custom .JSON file with custom envelopes!
howToPlay.btnGotIt=Got it!

