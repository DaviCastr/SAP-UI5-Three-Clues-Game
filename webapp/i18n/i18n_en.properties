howToPlay.aboutTitle=🎯 ABOUT THE GAME
howToPlay.aboutText=A guessing game inspired by the classic TV show! The goal is to guess the secret word using as few clues as possible.

howToPlay.scoreTitle=🏆 CLUE SCORING
howToPlay.hint1=1st Clue
